# Opens the Workqora createRun-only PR using a PAT that can write
# khomchatwongwai-tech/workqora. This repo's GITHUB_TOKEN cannot.
#
# Setup (once):
#   BarberGo → Settings → Secrets and variables → Actions
#   Name: WORKQORA_GITHUB_TOKEN
#   Value: a PAT or fine-grained token with Contents + Pull requests write
#          on khomchatwongwai-tech/workqora
# Then: Actions → "Ship Workqora createRun PR" → Run workflow
# Scheduled runs no-op with success until that secret exists, then open the PR.
name: Ship Workqora createRun PR

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

jobs:
  ship:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout BarberGo kit
        uses: actions/checkout@v4

      - name: Open createRun-only PR when token is present
        env:
          WORKQORA_GITHUB_TOKEN: ${{ secrets.WORKQORA_GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.WORKQORA_GITHUB_TOKEN }}
        run: |
          if [ -z "${WORKQORA_GITHUB_TOKEN}" ]; then
            echo "WORKQORA_GITHUB_TOKEN is not set. Add it (Contents + PRs write on khomchatwongwai-tech/workqora) or paste-over issue 307."
            exit 0
          fi
          chmod +x operator/workqora/ship-createrun.sh
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          ./operator/workqora/ship-createrun.sh
